<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الأماكن للسفر والسياحة - حجز رحلة</title>
    <!-- خط تجوال من خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0d6efd; /* اللون الرئيسي - أزرق طيران */
            --secondary-color: #0b5ed7;
            --accent-color: #ffc107; /* لون تمييز - ذهبي/أصفر */
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .header p {
            color: #6c757d;
            font-size: 1.1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95rem;
        }

        input, select, textarea {
            padding: 12px 15px;
            border: 1.5px solid #ced4da;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--secondary-color);
        }

        .footer-note {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: #888;
        }

        /* تجاوب مع الشاشات الصغيرة */
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- هيدر واسم الشركة -->
        <div class="header">
            <h1>شركة الأماكن للسفر والسياحة</h1>
            <p>وجهتك الأولى لاكتشاف العالم بأعلى درجات الراحة والرفاهية</p>
        </div>

        <!-- نموذج الحجز -->
        <form id="bookingForm">
            <div class="form-grid">
                
                <!-- نوع الخدمة -->
                <div class="form-group">
                    <label for="serviceType">نوع الخدمة المطلوبة *</label>
                    <select id="serviceType" required>
                        <option value="">اختر الخدمة...</option>
                        <option value="برنامج سياحي متكامل">برنامج سياحي متكامل</option>
                        <option value="حجز تذاكر طيران">حجز تذاكر طيران</option>
                        <option value="حجز فنادق ومنتجعات">حجز فنادق ومنتجعات</option>
                        <option value="استخراج تأشيرة دخول (فيزا)">استخراج تأشيرة دخول (فيزا)</option>
                        <option value="استقبال وتوصيل مطار">استقبال وتوصيل مطار</option>
                    </select>
                </div>

                <!-- الوجهة -->
                <div class="form-group">
                    <label for="destination">الوجهة (البلد / المدينة) *</label>
                    <input type="text" id="destination" placeholder="مثال: تركيا، دبي، ماليزيا..." required>
                </div>

                <!-- تاريخ المغادرة -->
                <div class="form-group">
                    <label for="departureDate">تاريخ المغادرة المتوقع *</label>
                    <input type="date" id="departureDate" required>
                </div>

                <!-- تاريخ العودة -->
                <div class="form-group">
                    <label for="returnDate">تاريخ العودة المتوقع</label>
                    <input type="date" id="returnDate">
                </div>

                <!-- عدد المسافرين -->
                <div class="form-group">
                    <label for="adultsCount">عدد البالغين (+12 سنة) *</label>
                    <input type="number" id="adultsCount" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label for="childrenCount">عدد الأطفال (أقل من 12 سنة)</label>
                    <input type="number" id="childrenCount" min="0" value="0">
                </div>

                <!-- بيانات التواصل -->
                <div class="form-group">
                    <label for="fullName">الاسم الكامل *</label>
                    <input type="text" id="fullName" placeholder="أدخل اسمك الكريِم" required>
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف / الواتساب *</label>
                    <input type="tel" id="phone" placeholder="07xxxxxxxx" required>
                </div>

                <!-- ملاحظات إضافية -->
                <div class="form-group full-width">
                    <label for="notes">ملاحظات أو طلبات خاصة</label>
                    <textarea id="notes" rows="4" placeholder="اكتب تفاصيل درجة الطيران المفضلة (اقتصادية/رجال أعمال)، تصنيف الفندق (4 أو 5 نجوم)، أو أي خدمات إضافية..."></textarea>
                </div>

            </div>

            <!-- زر الإرسال -->
            <button type="submit" class="btn-submit">تأكيد وإرسال طلب الحجز عبر الواتساب</button>
        </form>

        <div class="footer-note">
            جميع الحقوق محفوظة © شركة الأماكن للسفر والسياحة
        </div>
    </div>

    <!-- كود الجافا سكريبت لتحويل البيانات للواتساب -->
    <script>
        // ضع رقم واتساب الشركة هنا مع الرمز الدولي (مثال بالعراق: 9647XXXXXXXXX)
        const companyWhatsAppNumber = "9647000000000"; 

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // جلب البيانات من النموذج
            const service = document.getElementById('serviceType').value;
            const destination = document.getElementById('destination').value;
            const depDate = document.getElementById('departureDate').value;
            const retDate = document.getElementById('returnDate').value || "غير محدد";
            const adults = document.getElementById('adultsCount').value;
            const children = document.getElementById('childrenCount').value;
            const name = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const notes = document.getElementById('notes').value || "لا يوجد";

            // صياغة الرسالة
            const message = `*طلب حجز جديد - شركة الأماكن للسفر والسياحة*%0A%0A` +
                `*الاسم:* ${name}%0A` +
                `*رقم الهاتف:* ${phone}%0A` +
                `*الخدمة المطلوبة:* ${service}%0A` +
                `*الوجهة:* ${destination}%0A` +
                `*تاريخ المغادرة:* ${depDate}%0A` +
                `*تاريخ العودة:* ${retDate}%0A` +
                `*عدد البالغين:* ${adults}%0A` +
                `*عدد الأطفال:* ${children}%0A` +
                `*ملاحظات إضافية:* ${notes}`;

            // فتح الواتساب ممرراً الرسالة
            const whatsappURL = `https://wa.me/${companyWhatsAppNumber}?text=${message}`;
            window.open(whatsappURL, '_blank');
        });
    </script>
</body>
</html>
